name: CI

on:
  push:
  pull_request:

jobs:
  build-flux-mcp:
    name: Build + test (flux-mcp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flux-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flux-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  build-fluxos-cli:
    name: Build + test (fluxos-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            flux-mcp/package-lock.json
            fluxos-cli/package-lock.json
      - name: Build shared flux-mcp dependency
        working-directory: flux-mcp
        run: |
          npm ci
          npm run build
      - name: Build + test fluxos-cli
        working-directory: fluxos-cli
        run: |
          npm ci
          npm run build
          npm test
      - name: Pack fluxos-cli artifact
        working-directory: fluxos-cli
        run: |
          mkdir -p ../dist
          npm pack --pack-destination ../dist
          mv ../dist/fluxos-cli-*.tgz ../dist/fluxos-cli.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: fluxos-cli.tgz
          path: dist/fluxos-cli.tgz

  package-flux-cloud-skill:
    name: Package (skill artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/package_skill.py codex/flux-cloud dist --out-name flux-cloud-codex
      - run: python3 scripts/package_skill.py claude/flux-cloud dist --out-name flux-cloud-claude
      - uses: actions/upload-artifact@v4
        with:
          name: flux-cloud-codex.skill
          path: dist/flux-cloud-codex.skill
      - uses: actions/upload-artifact@v4
        with:
          name: flux-cloud-claude.skill
          path: dist/flux-cloud-claude.skill
