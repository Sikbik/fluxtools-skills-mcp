name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build + attach Flux skill artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flux-mcp/package-lock.json
      - name: Build + test flux-mcp
        working-directory: flux-mcp
        run: |
          npm ci
          npm run build
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Package skill artifacts
        run: |
          python3 scripts/package_skill.py codex/flux-cloud dist --out-name flux-cloud-codex
          python3 scripts/package_skill.py claude/flux-cloud dist --out-name flux-cloud-claude
          test -f dist/flux-cloud-codex.skill
          test -f dist/flux-cloud-claude.skill

      - name: Create GitHub release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/flux-cloud-codex.skill
            dist/flux-cloud-claude.skill
          fail_on_unmatched_files: true
